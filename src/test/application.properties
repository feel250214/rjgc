# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/hr_management?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.hr.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 服务器配置
server.port=8080
server.servlet.context-path=/api

knife4j.enable=true
springdoc.api-docs.enabled=true
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.hr.controller
